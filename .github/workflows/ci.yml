name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        # C3: mínimo 15 por NULLS NOT DISTINCT; misma versión mayor que Docker local.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: moss
          POSTGRES_PASSWORD: moss
          POSTGRES_DB: moss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moss -d moss_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://moss:moss@localhost:5432/moss_test
      # Solo para la base efímera del job; no es una credencial de despliegue.
      SESSION_SECRET: ci-only-session-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: PostgreSQL >=15
        run: test "$(psql "$DATABASE_URL" -Atc 'SHOW server_version_num')" -ge 150000
      - run: pnpm db:migrate
      # Con las migraciones aplicadas, schema.ts no debe producir una migración nueva ni cambiar
      # las existentes: si lo hace, falta generar y commitear la migración.
      - name: Sin drift entre schema.ts y las migraciones
        run: |
          pnpm db:generate
          drift="$(git status --porcelain -- apps/api/drizzle)"
          if [ -n "$drift" ]; then
            echo "::error::schema.ts no coincide con las migraciones. Corre pnpm db:generate y commitea el resultado."
            echo "$drift"
            git diff -- apps/api/drizzle
            exit 1
          fi
      - run: pnpm --filter api test:e2e
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Capturas de pantalla de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-playwright
          path: apps/web/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
